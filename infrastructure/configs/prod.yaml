environment: prod
region: us-east-1

storage:
  raw_bucket_prefix: data-platform-raw
  staging_bucket_prefix: data-platform-staging
  curated_bucket_prefix: data-platform-curated
  analytics_bucket_prefix: data-platform-analytics

transform:
  stage_a:
    worker_type: G.2X
    number_of_workers: 5
  stage_b:
    worker_type: G.2X
    number_of_workers: 10

orchestration:
  schedule: "cron(0 6 * * ? *)"
  timeout_hours: 4

monitoring:
  alert_email: data-platform-oncall@company.com
